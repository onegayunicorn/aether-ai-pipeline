[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-ai-pipeline"
version = "1.0.0"
description = "Complete AI-to-MotoG35 Command Execution Pipeline for Aether Grid"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Tyrone J Power Ω", email = "tyrone@onegayunicorn.foundation"}
]
keywords = [
    "aether",
    "orchestrator",
    "autonomous",
    "ai",
    "pipeline",
    "api",
    "websocket",
    "voice",
    "dashboard",
    "quantum",
    "coherence",
    "entanglement",
    "automation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "python-socketio>=5.10.0",
    "orjson>=3.9.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "rich>=13.7.0",
    "structlog>=23.2.0",
    "cryptography>=41.0.0",
    "pyjwt>=2.8.0",
    "psutil>=5.9.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "pydub>=0.25.1",
    "SpeechRecognition>=3.10.0",
    "croniter>=2.0.3",
]

[project.optional-dependencies]
dev = [
    "black>=23.10.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-pyyaml>=6.0.0",
    "types-requests>=2.31.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
whisper = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "whisper>=1.0.0",
]
vosk = [
    "vosk>=0.1.42",
]
piper = [
    "piper-tts>=0.0.2",
]
coqui = [
    "TTS>=0.13.3",
]

[project.scripts]
aether-ai-api = "api.main:main"

[project.urls]
Homepage = "https://github.com/onegayunicorn/aether-ai-pipeline"
Documentation = "https://github.com/onegayunicorn/aether-ai-pipeline#readme"
Repository = "https://github.com/onegayunicorn/aether-ai-pipeline"
Issues = "https://github.com/onegayunicorn/aether-ai-pipeline/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "pipeline*", "voice*", "scripts*", "config*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
